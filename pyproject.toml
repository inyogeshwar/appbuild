[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appbuild"
version = "0.1.0"
description = "Autonomous mobile app generator for Flutter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
appbuild = "appbuild.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["appbuild*"]
